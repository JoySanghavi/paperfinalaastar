# -----------------------------------------------------------------------------
# SKA-Low AA* — joint gain calibration + 21-cm power-spectrum inference with falcon
#
# Stage 1  q(z  | V_ref):           gains from the reference-calibrator visibilities
# Stage 2  q(pw | pk_obs, V_ref):   power spectrum from the dirty-image P(k), marginalising
#                                   over the gains through V_ref
#
#   z ──► gains ──────────────────────────────────────────────► V_ref   [observed]
#               └──► stacked_uv ──┐
#                                 ├──► tracked_uv ──► normed_tracked_uv ──┐
#   pw ──► df ──► bt ──► image ──► uvimage ──┘                            ├──► x ──► obsx ──► pk_obs [observed]
#          └──► pk_df              └──► noiseimage ──────────────────────┘
#
# Simulator classes: src/model.py. Set-up (box size, noise, known antennas, ...):
# src/settings.py. Observations: data/*.npy, written by `python scripts/gen_mock_data.py`.
# Run from this directory:  falcon launch  (see README.md)
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  wandb:
    enabled: true
    project: run_01
    group: Paperenv
    dir: ${run_dir}
  local:
    enabled: true
    dir: ${paths.graph}
  # console:
  #   level: DEBUG

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  imports: ["./src"]
  # buffer: ${run_dir}/sim_dir
  graph:  ${run_dir}/graph
  samples: ${run_dir}/samples

# -----------------------------------------------------------------------------
# Training buffer
# -----------------------------------------------------------------------------
buffer:
  # min_samples, validation_samples and simulate_count scaled down 4x (previously 16384 /
  # 1024 / 2048; max_samples unchanged) to shorten the initial simulation
  # (min_samples + validation_samples = 4352 samples, ~4 MB each).
  min_samples:         4096
  max_samples:         32768
  validation_samples:  256
  simulate_count:      512
  simulate_chunk_size: 128
  simulate_when_full:  true
  simulate_interval:   1
  snapshot_every:      100   # write every 100th sample to disk (was store_fraction: 0.01)

# -----------------------------------------------------------------------------
# Graph
# -----------------------------------------------------------------------------
graph:

  # ── Root nodes (parameters to infer) ──────────────────────────────────────

  z:
    # Gain perturbations of the UNKNOWN antennas, interleaved (Re, Im): g = 1 + z.
    # 212 parameters = 2*(nant-1-KNOWN_ANT) = 2*(307-1-200): 1 reference antenna g_0 = 1,
    # 106 unknown (antennas 1-106), 200 known with g = 1 (KNOWN_ANT in src/settings.py).
    # The number of priors below must equal 2*(nant-1-KNOWN_ANT).
    # Stage 1: infer gains from the reference visibility V_ref.
    evidence: [V_ref]
    simulator:
      _target_: falcon.priors.Product
      priors:
        - ['uniform', -1.0, 1.0]
        - ['uniform', -1.0, 1.0]
        - ['uniform', -1.0, 1.0]
        - ['uniform', -1.0, 1.0]
        - ['uniform', -1.0, 1.0]
