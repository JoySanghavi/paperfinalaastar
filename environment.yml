# Environment used for output/run_04 (conda env `newfalcongaincal`).
#   conda env create -f environment.yml
#   conda activate newfalcongaincal
# torch is the CUDA 12.4 build; on a machine without CUDA 12.4 drop the
# --extra-index-url line (the CPU / default build works for everything except training speed).
name: newfalcongaincal
channels:
  - defaults
dependencies:
  - python=3.12
  - numpy=2.4.2
  - scipy=1.17.0
  - matplotlib=3.10.8
  - pandas=3.0.0
  - pillow=12.1.0
  - pyyaml=6.0.3
  - jupyter=1.1.1
  - ipykernel=6.31.0
  - nbclient=0.10.4
  - nbformat=5.10.4
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1
      - falcon-sbi==0.4.1     # pulls in ray, omegaconf, coolname
      - sbi==0.25.0           # used by falcon's Flow estimator (MAF)
      - wandb==0.25.0         # config.yml logging.wandb.enabled: true
      - corner==2.2.3         # notebooks/plot_posteriors.ipynb
      - timm==1.0.26          # only for the optional image-backbone embedding in src/embedding.py
