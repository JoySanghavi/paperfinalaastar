# Environment for the current config.yml (conda env `paperenv`, falcon-sbi 0.5.1).
#   conda env create -f environment.yml
#   conda activate paperenv
# torch is the CUDA 13.0 build; on a machine without CUDA 13.0 drop the
# --extra-index-url line (the CPU / default build works for everything except training speed).
# output/run_04 was trained in an older env (`newfalcongaincal`: Python 3.12, torch 2.5.1 + CUDA 12.4,
# falcon-sbi 0.4.1), which cannot run the current config.yml.
name: paperenv
channels:
  - defaults
dependencies:
  - python=3.14
  - numpy=2.5.3
  - scipy=1.18.1
  - matplotlib=3.11.2
  - pandas=3.0.6
  - pillow=12.3.0
  - pyyaml=6.0.3
  - jupyter=1.1.1
  - ipykernel=7.3.0
  - nbclient=0.11.0
  - nbformat=5.11.0
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.14.1
      - falcon-sbi==0.5.1     # pulls in ray, omegaconf, coolname
      - sbi==0.27.0           # used by falcon's Flow estimator (MAF); not installed by falcon 0.5
      - wandb==0.31.0         # config.yml logging.wandb.enabled: true; not installed by falcon 0.5
      - corner==2.3.0         # notebooks/plot_posteriors.ipynb
      - timm==1.0.30          # only for the optional image-backbone embedding in src/embedding.py
